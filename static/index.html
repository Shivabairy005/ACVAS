<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACVAS — Ambient Context Volume Dashboard</title>
    <meta name="description" content="Real-time ambient context monitoring and volume control dashboard for ACVAS.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── Reset & Base ──────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary:   #0f1117;
            --bg-card:      #1a1d27;
            --bg-card-alt:  #22263340;
            --border:       #2a2e3a;
            --text-primary: #e8eaed;
            --text-muted:   #9aa0ab;
            --accent:       #6c63ff;

            /* Environment colours */
            --env-silent:   #2ecc71;
            --env-office:   #3498db;
            --env-home:     #f39c12;
            --env-crowded:  #e74c3c;
            --env-unknown:  #7f8c8d;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px 16px 40px;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Header ────────────────────────────────────────────────── */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6c63ff, #48c6ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }
        .header .subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ── Connection status chip ────────────────────────────────── */
        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #1e222d;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        .status-chip .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--env-unknown);
            transition: background 0.3s ease;
        }
        .status-chip.connected .dot { background: var(--env-silent); box-shadow: 0 0 8px var(--env-silent); }
        .status-chip.disconnected .dot { background: var(--env-crowded); }

        /* ── Card ──────────────────────────────────────────────────── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .card-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        /* ── Environment Display ───────────────────────────────────── */
        .env-display {
            text-align: center;
        }
        .env-badge {
            display: inline-block;
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 8px 32px;
            border-radius: 12px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(108, 99, 255, 0.15); }
            50%      { box-shadow: 0 0 35px rgba(108, 99, 255, 0.3); }
        }
        .env-badge.silent  { color: var(--env-silent);  background: rgba(46,204,113,0.12);  box-shadow: 0 0 25px rgba(46,204,113,0.2); }
        .env-badge.office  { color: var(--env-office);  background: rgba(52,152,219,0.12);  box-shadow: 0 0 25px rgba(52,152,219,0.2); }
        .env-badge.home    { color: var(--env-home);    background: rgba(243,156,18,0.12);  box-shadow: 0 0 25px rgba(243,156,18,0.2); }
        .env-badge.crowded { color: var(--env-crowded); background: rgba(231,76,60,0.12);   box-shadow: 0 0 25px rgba(231,76,60,0.2); }
        .env-badge.unknown { color: var(--env-unknown); background: rgba(127,140,141,0.12); box-shadow: 0 0 25px rgba(127,140,141,0.15); }

        .confidence {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .confidence span {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* ── Volume Bar ────────────────────────────────────────────── */
        .volume-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .volume-label {
            font-size: 1.4rem;
            font-weight: 700;
            min-width: 58px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .volume-track {
            flex: 1;
            height: 14px;
            background: #2a2e3a;
            border-radius: 7px;
            overflow: hidden;
            position: relative;
        }
        .volume-fill {
            height: 100%;
            border-radius: 7px;
            background: linear-gradient(90deg, var(--env-silent), var(--env-office), var(--env-home), var(--env-crowded));
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .volume-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 100%);
            border-radius: 7px;
        }

        /* ── Manual Override ───────────────────────────────────────── */
        .override-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .override-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #2a2e3a;
            outline: none;
        }
        .override-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid var(--bg-primary);
            box-shadow: 0 0 10px rgba(108, 99, 255, 0.4);
            transition: transform 0.15s ease;
        }
        .override-slider::-webkit-slider-thumb:active {
            transform: scale(1.15);
        }
        .override-value {
            font-size: 0.85rem;
            font-weight: 600;
            min-width: 38px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .override-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #6c63ff, #5a54e0);
            color: #fff;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .override-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
        }
        .override-btn:active {
            transform: scale(0.97);
        }

        /* ── Event Log ─────────────────────────────────────────────── */
        .log-list {
            list-style: none;
            max-height: 320px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #2a2e3a transparent;
        }
        .log-list::-webkit-scrollbar { width: 4px; }
        .log-list::-webkit-scrollbar-track { background: transparent; }
        .log-list::-webkit-scrollbar-thumb { background: #2a2e3a; border-radius: 2px; }

        .log-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            transition: background 0.15s ease;
            animation: slide-in 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .log-item:hover { background: var(--bg-card-alt); }

        @keyframes slide-in {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .log-time {
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            min-width: 64px;
        }
        .log-env {
            font-weight: 600;
            min-width: 70px;
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
        }
        .log-env.silent  { color: var(--env-silent); }
        .log-env.office  { color: var(--env-office); }
        .log-env.home    { color: var(--env-home); }
        .log-env.crowded { color: var(--env-crowded); }
        .log-env.unknown { color: var(--env-unknown); }

        .log-conf, .log-vol {
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }
        .log-vol { margin-left: auto; }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* ── Responsive ────────────────────────────────────────────── */
        @media (min-width: 480px) {
            body { max-width: 460px; margin: 0 auto; padding: 32px 20px 60px; }
            .header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header" id="header">
        <h1>ACVAS</h1>
        <p class="subtitle">Ambient Context Volume Adaptation</p>
        <div class="status-chip disconnected" id="status-chip">
            <span class="dot"></span>
            <span id="status-text">Disconnected</span>
        </div>
    </header>

    <!-- Environment Display -->
    <section class="card" id="env-card">
        <div class="card-title">Current Environment</div>
        <div class="env-display">
            <div class="env-badge unknown" id="env-badge">—</div>
            <div class="confidence">Confidence: <span id="confidence-value">—</span></div>
        </div>
    </section>

    <!-- Volume Bar -->
    <section class="card" id="volume-card">
        <div class="card-title">System Volume</div>
        <div class="volume-section">
            <span class="volume-label" id="volume-label">—</span>
            <div class="volume-track">
                <div class="volume-fill" id="volume-fill" style="width: 0%"></div>
            </div>
        </div>
    </section>

    <!-- Manual Override -->
    <section class="card" id="override-card">
        <div class="card-title">Manual Override</div>
        <div class="override-row">
            <input type="range" class="override-slider" id="override-slider"
                   min="0" max="100" value="50">
            <span class="override-value" id="override-value">50%</span>
            <button class="override-btn" id="override-btn">Set</button>
        </div>
    </section>

    <!-- Event Log -->
    <section class="card" id="log-card">
        <div class="card-title">Event Log</div>
        <ul class="log-list" id="log-list">
            <li class="empty-state" id="empty-state">Waiting for events …</li>
        </ul>
    </section>

    <script>
        // ── Configuration ─────────────────────────────────────────
        const SERVER_IP = window.location.hostname;
        const WS_PORT   = 8765;
        const MAX_LOG   = 20;

        // ── DOM References ────────────────────────────────────────
        const statusChip    = document.getElementById('status-chip');
        const statusText    = document.getElementById('status-text');
        const envBadge      = document.getElementById('env-badge');
        const confValue     = document.getElementById('confidence-value');
        const volumeLabel   = document.getElementById('volume-label');
        const volumeFill    = document.getElementById('volume-fill');
        const overrideSlider = document.getElementById('override-slider');
        const overrideValue = document.getElementById('override-value');
        const overrideBtn   = document.getElementById('override-btn');
        const logList       = document.getElementById('log-list');
        const emptyState    = document.getElementById('empty-state');

        // ── Colour Mapping ────────────────────────────────────────
        const ENV_COLOURS = {
            silent:  'silent',
            office:  'office',
            home:    'home',
            crowded: 'crowded',
            unknown: 'unknown',
        };

        // ── WebSocket ─────────────────────────────────────────────
        let ws = null;

        function connect() {
            const url = `ws://${SERVER_IP}:${WS_PORT}`;
            ws = new WebSocket(url);

            ws.onopen = () => {
                statusChip.className = 'status-chip connected';
                statusText.textContent = 'Connected';
            };

            ws.onclose = () => {
                statusChip.className = 'status-chip disconnected';
                statusText.textContent = 'Reconnecting …';
                setTimeout(connect, 3000);
            };

            ws.onerror = () => {
                ws.close();
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.warn('Invalid message:', e);
                }
            };
        }

        // ── Message Handler ───────────────────────────────────────
        function handleMessage(data) {
            const env  = data.env  || 'unknown';
            const conf = data.confidence != null ? data.confidence : 0;
            const vol  = data.volume != null ? data.volume : 0;

            // Update environment badge
            envBadge.textContent = env;
            envBadge.className = 'env-badge ' + (ENV_COLOURS[env] || 'unknown');

            // Update confidence
            confValue.textContent = (conf * 100).toFixed(1) + '%';

            // Update volume bar
            const pct = Math.round(vol * 100);
            volumeLabel.textContent = pct + '%';
            volumeFill.style.width = pct + '%';

            // Prepend to event log
            addLogEntry(env, conf, vol);
        }

        // ── Event Log ─────────────────────────────────────────────
        function addLogEntry(env, conf, vol) {
            // Remove empty state
            if (emptyState) emptyState.remove();

            const li = document.createElement('li');
            li.className = 'log-item';

            const now = new Date();
            const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            li.innerHTML = `
                <span class="log-time">${time}</span>
                <span class="log-env ${ENV_COLOURS[env] || 'unknown'}">${env}</span>
                <span class="log-conf">${(conf * 100).toFixed(1)}%</span>
                <span class="log-vol">Vol ${Math.round(vol * 100)}%</span>
            `;

            logList.prepend(li);

            // Trim to MAX_LOG entries
            while (logList.children.length > MAX_LOG) {
                logList.removeChild(logList.lastChild);
            }
        }

        // ── Override Controls ─────────────────────────────────────
        overrideSlider.addEventListener('input', () => {
            overrideValue.textContent = overrideSlider.value + '%';
        });

        overrideBtn.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const volume = parseInt(overrideSlider.value, 10) / 100;
                ws.send(JSON.stringify({ type: 'override', volume: volume }));

                // Visual feedback
                overrideBtn.textContent = '✓ Sent';
                overrideBtn.style.background = 'linear-gradient(135deg, #2ecc71, #27ae60)';
                setTimeout(() => {
                    overrideBtn.textContent = 'Set';
                    overrideBtn.style.background = '';
                }, 1200);
            }
        });

        // ── Init ──────────────────────────────────────────────────
        connect();
    </script>
</body>
</html>
